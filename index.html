<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Design Portfolio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-dim);
        }

        .upload-section {
            max-width: 600px;
            margin: 0 auto 40px auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .upload-section h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.95rem;
        }

        .paste-zone {
            border: 2px dashed var(--accent-color);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(99, 102, 241, 0.05);
        }

        .paste-zone p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: #4f46e5;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 15px;
        }

        .card-body h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .card-body .tag {
            display: inline-block;
            background: #334155;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .card-body .btn-delete {
            float: right;
            background: transparent;
            color: #ef4444;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎨 My Design Portfolio</h1>
        <p>Paste or upload your designs to display them live</p>
    </header>

    <div class="upload-section">
        <h2>Add New Design</h2>
        <div class="input-group">
            <label>Design Title</label>
            <input type="text" id="titleInput" placeholder="e.g., Event Flyer / Logo Design">
        </div>
        <div class="input-group">
            <label>Category</label>
            <select id="categoryInput">
                <option value="Flyer / Poster">Flyer / Poster</option>
                <option value="Logo / Branding">Logo / Branding</option>
                <option value="Social Media">Social Media</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="input-group">
            <label>Choose File OR Paste Image (`Ctrl + V`):</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="paste-zone">
            <p>Press <strong>Ctrl + V</strong> anywhere on the page to paste a copied image!</p>
        </div>
        <button class="btn-submit" onclick="addDesign()">Add to Gallery</button>
    </div>

    <main class="gallery" id="galleryContainer"></main>

    <script>
        let currentImageData = "";

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentImageData = evt.target.result;
                    alert("Image selected!");
                };
                reader.readAsDataURL(file);
            }
        });

        window.addEventListener('paste', function(e) {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        currentImageData = evt.target.result;
                        alert("Image pasted successfully!");
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        function addDesign() {
            const title = document.getElementById('titleInput').value.trim();
            const category = document.getElementById('categoryInput').value;

            if (!title) {
                alert("Please enter a title for your design.");
                return;
            }
            if (!currentImageData) {
                alert("Please select or paste an image first!");
                return;
            }

            const newDesign = {
                id: Date.now(),
                title: title,
                category: category,
                image: currentImageData
            };

            const designs = JSON.parse(localStorage.getItem('myDesigns') || '[]');
            designs.push(newDesign);
            localStorage.setItem('myDesigns', JSON.stringify(designs));

            document.getElementById('titleInput').value = '';
            document.getElementById('fileInput').value = '';
            currentImageData = '';

            renderGallery();
        }

        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            const designs = JSON.parse(localStorage.getItem('myDesigns') || '[]');
            container.innerHTML = '';

            if (designs.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #94a3b8;">No designs added yet. Add one above!</p>';
                return;
            }

            designs.reverse().forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.image}" alt="${item.title}">
                    <div class="card-body">
                        <h3>${item.title}</h3>
                        <span class="tag">${item.category}</span>
                        <button class="btn-delete" onclick="deleteDesign(${item.id})">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteDesign(id) {
            let designs = JSON.parse(localStorage.getItem('myDesigns') || '[]');
            designs = designs.filter(item => item.id !== id);
            localStorage.setItem('myDesigns', JSON.stringify(designs));
            renderGallery();
        }

        renderGallery();
    </script>
</body>
</html>
